name: Admin Marketing Asset Library
on:
  push:
    branches: [codex/admin-marketing-asset-library]
  pull_request:
    paths:
      - 'Golfriend_Web_Admin/golfriend-admin/**'
      - '.github/workflows/admin-marketing-assets.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Golfriend_Web_Admin/golfriend-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            Golfriend_Web_Admin/golfriend-admin/package-lock.json
            Golfriend_Web_Admin/golfriend-admin/functions/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: Golfriend_Web_Admin/golfriend-admin/functions
      - run: npm test
        working-directory: Golfriend_Web_Admin/golfriend-admin/functions
      - run: npm run verify:marketing-library
      - run: npm run test:marketing-rules
      - run: npm run gate:fnauth
      - run: npm run gate:a11y
      - run: npm run build
      - run: git diff --check
        working-directory: .
